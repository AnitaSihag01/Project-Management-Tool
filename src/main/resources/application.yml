server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pmtool}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgre123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-demo-secret-key-change-it-before-going-to-production-1234}
    expiration-ms: 86400000